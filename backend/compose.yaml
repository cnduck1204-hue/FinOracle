name: finoracle

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finoracle}
      MYSQL_USER: ${MYSQL_USER:-finoracle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}"
          --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1"
          >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  # .doc、.rtf、.odt 转 PDF；独立容器运行 LibreOffice，自带中日韩字体
  gotenberg:
    image: gotenberg/gotenberg:8.39.0-libreoffice
    command:
      - gotenberg
      # 低于 API 的 CONVERSION_TIMEOUT_SECONDS（默认 120 秒），超时时由 Gotenberg 先返回 503
      - --api-timeout=110s
      - --libreoffice-restart-after=10
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  # 文档原件与解析产物的对象存储，应用只通过 S3 API 访问。MinIO 社区版已停止维护、官方镜像
  # 不再公开，这里使用其维护分支 Silo（同样的接口、环境变量与数据格式）
  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # 开发环境中应用直接使用这组根凭据；生产应为应用创建只能访问文档桶的独立密钥
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-finoracle}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  # 切片向量与 BM25 关键词索引。单容器运行：内嵌 etcd、数据存本地卷（官方 standalone_embed.sh 的配置）
  milvus:
    image: milvusdb/milvus:v2.6.23
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    configs:
      - source: milvus_embed_etcd
        target: /milvus/configs/embedEtcd.yaml
      - source: milvus_user
        target: /milvus/configs/user.yaml
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 90s
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finoracle-api:local
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    environment:
      APP_NAME: ${APP_NAME:-FinOracle API}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      OPENAPI_ENABLED: "${OPENAPI_ENABLED:-true}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finoracle}
      MYSQL_USER: ${MYSQL_USER:-finoracle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      LOGIN_MAX_FAILURES: "${LOGIN_MAX_FAILURES:-5}"
      LOGIN_LOCK_SECONDS: "${LOGIN_LOCK_SECONDS:-900}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_ACCESS_TOKEN_MINUTES: "${JWT_ACCESS_TOKEN_MINUTES:-30}"
      JWT_REFRESH_TOKEN_DAYS: "${JWT_REFRESH_TOKEN_DAYS:-7}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      GOTENBERG_URL: http://gotenberg:3000
      CONVERSION_TIMEOUT_SECONDS: "${CONVERSION_TIMEOUT_SECONDS:-120}"
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-finoracle}
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      S3_BUCKET: ${S3_BUCKET:-finoracle-documents}
      # 检索时向量化问题并查询 Milvus；下架、替换或删除版本时清理向量。模型与维度须与 worker 一致
      MILVUS_URI: http://milvus:19530
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-1024}"
      # 未设置时检索返回 503，其余接口不受影响
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      # 视觉通道方案；未设置时该方案显示为不可用
      VISUAL_SERVICE_URL: ${VISUAL_SERVICE_URL:-}
      VISUAL_MODEL: ${VISUAL_MODEL:-vidore/colSmol-500M}
      VISUAL_DIMENSION: "${VISUAL_DIMENSION:-128}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 转换服务未就绪时只影响 .doc 等格式的解析，不阻塞 API 启动
      gotenberg:
        condition: service_started
      # 对象存储与向量库只用于文档入库，未就绪时不阻塞认证等其他接口
      minio:
        condition: service_started
      milvus:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          prefix = os.environ.get('API_V1_PREFIX', '/api/v1').rstrip('/');
          urllib.request.urlopen('http://127.0.0.1:8000' + prefix + '/ready', timeout=8).close()
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
  # 后台执行解析与向量化。使用 API 镜像，只传入所需的数据库、存储、转换与向量化配置，不含认证密钥
  worker:
    image: finoracle-api:local
    # 镜像由 api 服务构建，不从镜像仓库拉取
    pull_policy: never
    init: true
    command: ["python", "-m", "app.worker"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finoracle}
      MYSQL_USER: ${MYSQL_USER:-finoracle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      GOTENBERG_URL: http://gotenberg:3000
      CONVERSION_TIMEOUT_SECONDS: "${CONVERSION_TIMEOUT_SECONDS:-120}"
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-finoracle}
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      S3_BUCKET: ${S3_BUCKET:-finoracle-documents}
      WORKER_POLL_SECONDS: "${WORKER_POLL_SECONDS:-2}"
      JOB_LEASE_SECONDS: "${JOB_LEASE_SECONDS:-60}"
      AUTO_APPROVE_PARSED: "${AUTO_APPROVE_PARSED:-true}"
      MILVUS_URI: http://milvus:19530
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSION: "${EMBEDDING_DIMENSION:-1024}"
      # 未设置时向量化任务失败并提示配置；解析不受影响
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
      # 视觉通道方案；未设置时该方案显示为不可用
      VISUAL_SERVICE_URL: ${VISUAL_SERVICE_URL:-}
      VISUAL_MODEL: ${VISUAL_MODEL:-vidore/colSmol-500M}
      VISUAL_DIMENSION: "${VISUAL_DIMENSION:-128}"
    # 停止时先完成当前任务；超时被终止的任务在租约到期后由其他 worker 重新执行
    stop_grace_period: 30s
    depends_on:
      # API 启动时执行数据库迁移，健康后表结构已就绪
      api:
        condition: service_healthy
      minio:
        condition: service_started
      gotenberg:
        condition: service_started
      milvus:
        condition: service_started
  # 页面视觉编码（ColPali 系列），只有“版面视觉检索”方案需要。按需启动：
  #   docker compose --profile visual up -d visual，并设置 VISUAL_SERVICE_URL=http://visual:8100
  visual:
    profiles: ["visual"]
    build:
      context: ./visual_service
    image: finoracle-visual:local
    init: true
    environment:
      VISUAL_MODEL: ${VISUAL_MODEL:-vidore/colSmol-500M}
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      # 实测 xet 传输会持续重试而文件不再增长，改用普通 HTTPS 下载
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "127.0.0.1:${VISUAL_PORT:-8100}:8100"
    volumes:
      - visual_models:/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5).close()
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 30s
volumes:
  mysql_data:
  redis_data:
  minio_data:
  milvus_data:
  visual_models:
configs:
  milvus_embed_etcd:
    content: |
      listen-client-urls: http://0.0.0.0:2379
      advertise-client-urls: http://0.0.0.0:2379
      quota-backend-bytes: 4294967296
      auto-compaction-mode: revision
      auto-compaction-retention: '1000'
  milvus_user:
    content: |
      # Extra config to override default milvus.yaml
