name: finoracle

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finoracle}
      MYSQL_USER: ${MYSQL_USER:-finoracle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}"
          --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1"
          >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  redis:
    image: redis:7.4
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  # .doc、.rtf、.odt 转 PDF；独立容器运行 LibreOffice，自带中日韩字体
  gotenberg:
    image: gotenberg/gotenberg:8.39.0-libreoffice
    command:
      - gotenberg
      # 低于 API 的 CONVERSION_TIMEOUT_SECONDS（默认 120 秒），超时时由 Gotenberg 先返回 503
      - --api-timeout=110s
      - --libreoffice-restart-after=10
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  # 文档原件与解析产物的对象存储，应用只通过 S3 API 访问。MinIO 社区版已停止维护、官方镜像
  # 不再公开，这里使用其维护分支 Silo（同样的接口、环境变量与数据格式）
  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # 开发环境中应用直接使用这组根凭据；生产应为应用创建只能访问文档桶的独立密钥
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-finoracle}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finoracle-api:local
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    environment:
      APP_NAME: ${APP_NAME:-FinOracle API}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      OPENAPI_ENABLED: "${OPENAPI_ENABLED:-true}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finoracle}
      MYSQL_USER: ${MYSQL_USER:-finoracle}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      LOGIN_MAX_FAILURES: "${LOGIN_MAX_FAILURES:-5}"
      LOGIN_LOCK_SECONDS: "${LOGIN_LOCK_SECONDS:-900}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}"
      JWT_ALGORITHM: "${JWT_ALGORITHM:-HS256}"
      JWT_ACCESS_TOKEN_MINUTES: "${JWT_ACCESS_TOKEN_MINUTES:-30}"
      JWT_REFRESH_TOKEN_DAYS: "${JWT_REFRESH_TOKEN_DAYS:-7}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      GOTENBERG_URL: http://gotenberg:3000
      CONVERSION_TIMEOUT_SECONDS: "${CONVERSION_TIMEOUT_SECONDS:-120}"
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-finoracle}
      S3_SECRET_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required}"
      S3_BUCKET: ${S3_BUCKET:-finoracle-documents}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 转换服务未就绪时只影响 .doc 等格式的解析，不阻塞 API 启动
      gotenberg:
        condition: service_started
      # 对象存储只用于文档导入，未就绪时不阻塞认证等其他接口
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          prefix = os.environ.get('API_V1_PREFIX', '/api/v1').rstrip('/');
          urllib.request.urlopen('http://127.0.0.1:8000' + prefix + '/ready', timeout=8).close()
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
volumes:
  mysql_data:
  redis_data:
  minio_data:
