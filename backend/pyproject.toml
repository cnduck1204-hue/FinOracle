[project]
name = "finoracle"
version = "0.1.0"
description = "FinOracle authentication and backend foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncmy>=0.2.14",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
