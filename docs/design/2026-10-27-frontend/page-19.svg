<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="996" viewBox="52 6652 1456 996"><rect x="52" y="6652" width="1456" height="996" fill="white"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="28"><tspan x="60" y="6687.44">19  /  关键状态与反馈弹窗</tspan></text><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16"><tspan x="60" y="6720.68">统一状态规范  ·  有加载、有结果、有依据不足、有失败恢复  ·  黑色样式靠文字与边框区分</tspan></text><rect x="60" y="6740" width="1440" height="900" fill="#ffffff" stroke="#1e1e1e" stroke-width="1"/><rect x="100" y="6785" width="430" height="330" fill="none" stroke="#1e1e1e" stroke-width="1"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24"><tspan x="122" y="6830.52">检索与生成中</tspan></text><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17"><tspan x="122" y="6889.66">正在查找相关条文…</tspan><tspan x="122" y="6913.46">已定位依据后继续生成答案。</tspan><tspan x="122" y="6937.26">输入保留，支持中止本次生成。</tspan></text><rect x="122" y="7040" width="386" height="40" fill="none" stroke="#1e1e1e" stroke-width="2"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16"><tspan x="283.0" y="7064.4800000000005">停止生成</tspan></text><rect x="565" y="6785" width="430" height="330" fill="none" stroke="#1e1e1e" stroke-width="1"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24"><tspan x="587" y="6830.52">依据不足</tspan></text><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17"><tspan x="587" y="6889.66">已收录资料中未找到充分依据。</tspan><tspan x="587" y="6913.46">展示已尝试的制度范围。</tspan><tspan x="587" y="6937.26">建议补充业务场景或缩小范围。</tspan></text><rect x="587" y="7040" width="386" height="40" fill="none" stroke="#1e1e1e" stroke-width="2"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16"><tspan x="748.0" y="7064.4800000000005">修改问题</tspan></text><rect x="1030" y="6785" width="430" height="330" fill="none" stroke="#1e1e1e" stroke-width="1"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24"><tspan x="1052" y="6830.52">服务暂时不可用</tspan></text><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17"><tspan x="1052" y="6889.66">本次回答未完成。</tspan><tspan x="1052" y="6913.46">保留问题与已生成的内容。</tspan><tspan x="1052" y="6937.26">重试沿用原问题，不重复新建会话。</tspan></text><rect x="1052" y="7040" width="386" height="40" fill="none" stroke="#1e1e1e" stroke-width="2"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16"><tspan x="1213.0" y="7064.4800000000005">重新尝试</tspan></text><rect x="100" y="7160" width="430" height="330" fill="none" stroke="#1e1e1e" stroke-width="1"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24"><tspan x="122" y="7205.52">会话已失效</tspan></text><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17"><tspan x="122" y="7264.66">登录状态已失效，请重新登录。</tspan><tspan x="122" y="7288.46">保留当前页面与未发送问题。</tspan><tspan x="122" y="7312.26">登录后返回原位置。</tspan></text><rect x="122" y="7415" width="386" height="40" fill="none" stroke="#1e1e1e" stroke-width="2"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16"><tspan x="283.0" y="7439.4800000000005">重新登录</tspan></text><rect x="565" y="7160" width="430" height="330" fill="none" stroke="#1e1e1e" stroke-width="1"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24"><tspan x="587" y="7205.52">空结果 / 暂无收藏</tspan></text><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17"><tspan x="587" y="7264.66">未找到匹配内容。</tspan><tspan x="587" y="7288.46">展示当前筛选项与清除入口。</tspan><tspan x="587" y="7312.26">首次进入收藏页时引导收藏。</tspan></text><rect x="587" y="7415" width="386" height="40" fill="none" stroke="#1e1e1e" stroke-width="2"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16"><tspan x="748.0" y="7439.4800000000005">清除筛选</tspan></text><rect x="1030" y="7160" width="430" height="330" fill="none" stroke="#1e1e1e" stroke-width="1"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24"><tspan x="1052" y="7205.52">反馈问题</tspan></text><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17"><tspan x="1052" y="7264.66">选择：回答错误 / 引用错误 / 其他。</tspan><tspan x="1052" y="7288.46">补充具体问题；附上本次回答引用。</tspan><tspan x="1052" y="7312.26">提交后显示成功状态。</tspan></text><rect x="1052" y="7415" width="386" height="40" fill="none" stroke="#1e1e1e" stroke-width="2"/><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="16"><tspan x="1213.0" y="7439.4800000000005">提交反馈</tspan></text><text fill="#1e1e1e" font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17"><tspan x="100" y="7596.66">输入错误就近提示；权限不足与资源下架展示明确原因。中止生成后，已有内容标记为未完成。</tspan></text></svg>